project_id = "formulario-trazo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://trazo-psi.vercel.app"
additional_redirect_urls = [
  "https://trazo-psi.vercel.app/auth/callback",
  "https://trazo-git-codex-test-new-form-trazo4.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
