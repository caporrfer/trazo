services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazo
      POSTGRES_USER: trazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - trazo-db:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
    volumes:
      - trazo-files:/app/data

volumes:
  trazo-db:
  trazo-files:
